name: Build winevdm
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1


    - name: Install winflexbison (Chocolatey)
      shell: powershell
      run: |
        choco install winflexbison -y
        Import-Module $env:ChocolateyInstall\helpers\chocolateyProfile.psm1

    - name: Set up MSYS2 for assembler
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: mingw-w64-x86_64-binutils

    - name: Add Chocolatey bin to PATH
      shell: powershell
      run: |
        $chocBin = 'C:\ProgramData\chocolatey\bin'
        if (Test-Path $chocBin) {
          Add-Content -Path $env:GITHUB_PATH -Value $chocBin
        }
        # Also add the specific winflexbison tools directory
        $wfbTools = 'C:\ProgramData\chocolatey\lib\winflexbison\tools'
        if (Test-Path $wfbTools) {
          Add-Content -Path $env:GITHUB_PATH -Value $wfbTools
        }

    - name: Verify tools on PATH
      shell: powershell
      run: |
        Write-Output "=== Verify tools ==="
        Write-Output "PATH=$env:Path"
        
        # List all files in winflexbison lib directory to see what's actually installed
        Write-Output "=== winflexbison lib contents ==="
        Get-ChildItem -Path "C:\ProgramData\chocolatey\lib" -Recurse | Where-Object { $_.Name -like "*flex*" -or $_.Name -like "*bison*" } | Select-Object FullName
        
        # Check for assembler
        if (-not (Test-Path "C:\msys64\usr\bin\as.exe")) {
          Write-Error "as.exe not found in MSYS2 usr/bin"
          exit 1
        }
        
        Write-Output "Assembler found successfully"

    - name: Build Solution
      shell: powershell
      run: |
        msbuild otvdm.sln /t:Rebuild /p:Configuration=Release /p:Platform=Win32 `
          /p:AsmPath="C:\msys64\usr\bin\" `
          /p:FlexPath="" /p:BisonPath=""

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: otvdm-v0.9.0-build
        path: |
          **/*.exe
          **/*.dll

