name: Build winevdm
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1


    - name: Install winflexbison (Chocolatey)
      shell: powershell
      run: |
        choco install winflexbison -y
        Import-Module $env:ChocolateyInstall\helpers\chocolateyProfile.psm1

    - name: Set up MSYS2 for assembler
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: mingw-w64-x86_64-binutils

    - name: Add Chocolatey bin to PATH
      shell: powershell
      run: |
        $chocBin = 'C:\ProgramData\chocolatey\bin'
        if (Test-Path $chocBin) {
          Add-Content -Path $env:GITHUB_PATH -Value $chocBin
        }

    - name: Verify tools on PATH
      shell: powershell
      run: |
        Write-Output "=== Verify tools ==="
        $missing = $false

        if (-not (where.exe flex 2>$null)) {
          Write-Error "flex not found"
          $missing = $true
        }
        if (-not (where.exe bison 2>$null)) {
          Write-Error "bison not found"
          $missing = $true
        }
        if (-not (where.exe as 2>$null)) {
          Write-Error "as (assembler) not found"
          $missing = $true
        }

        if ($missing) { exit 1 }

        Write-Output "PATH=$env:Path"
        where.exe flex | Out-String | Write-Output
        where.exe bison | Out-String | Write-Output
        where.exe as | Out-String | Write-Output

    - name: Build Solution
      shell: powershell
      run: |
        msbuild otvdm.sln /t:Rebuild /p:Configuration=Release /p:Platform=Win32 `
          /p:AsmPath="C:\msys64\usr\bin\" `
          /p:FlexPath="" /p:BisonPath=""

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: otvdm-v0.9.0-build
        path: |
          **/*.exe
          **/*.dll

