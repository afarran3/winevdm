name: Build winevdm
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1


    - name: Install winflexbison (Chocolatey)
      shell: powershell
      run: |
        choco install winflexbison -y
        Import-Module $env:ChocolateyInstall\helpers\chocolateyProfile.psm1

    - name: Set up MSYS2 for assembler
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: mingw-w64-x86_64-binutils

    - name: Install binutils (assembler) in MSYS2
      run: |
        C:\msys64\usr\bin\bash.exe -lc "pacman -Syu --noconfirm"
        C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm binutils"
        
    - name: Add Chocolatey bin to PATH
      shell: powershell
      run: |
        $chocBin = 'C:\ProgramData\chocolatey\bin'
        if (Test-Path $chocBin) {
          Add-Content -Path $env:GITHUB_PATH -Value $chocBin
        }
        # Also add the specific winflexbison tools directory
        $wfbTools = 'C:\ProgramData\chocolatey\lib\winflexbison\tools'
        if (Test-Path $wfbTools) {
          Add-Content -Path $env:GITHUB_PATH -Value $wfbTools
        }

    - name: Verify tools on PATH
      shell: powershell
      run: |
        Write-Output "=== Verify tools ==="
        Write-Output "PATH=$env:Path"
        
        # Check for flex and bison (now we know they're in tools directory)
        if (-not (Test-Path "C:\ProgramData\chocolatey\lib\winflexbison\tools\win_flex.exe")) {
          Write-Error "win_flex.exe not found"
          exit 1
        }
        
        if (-not (Test-Path "C:\ProgramData\chocolatey\lib\winflexbison\tools\win_bison.exe")) {
          Write-Error "win_bison.exe not found"
          exit 1
        }
        
        # Check for assembler - list what's actually in both directories
        Write-Output "=== MSYS2 usr/bin contents ==="
        if (Test-Path "C:\msys64\usr\bin") {
          Get-ChildItem -Path "C:\msys64\usr\bin" -Filter "as*" | Select-Object Name
        } else {
          Write-Output "C:\msys64\usr\bin does not exist"
        }
        
        Write-Output "=== MSYS2 mingw64/bin contents ==="
        if (Test-Path "C:\msys64\mingw64\bin") {
          Get-ChildItem -Path "C:\msys64\mingw64\bin" -Filter "as*" | Select-Object Name
        } else {
          Write-Output "C:\msys64\mingw64\bin does not exist"
        }
        
        # Check for assembler in both locations
        if ((-not (Test-Path "C:\msys64\usr\bin\as.exe")) -and (-not (Test-Path "C:\msys64\mingw64\bin\as.exe"))) {
          Write-Error "as.exe not found in either MSYS2 usr/bin or mingw64/bin"
          exit 1
        }
        
        Write-Output "All tools found successfully"

    - name: Build Solution
      shell: powershell
      run: |
        # Try to find assembler in either location
        $asPath = ""
        if (Test-Path "C:\msys64\usr\bin\as.exe") {
          $asPath = "C:\msys64\usr\bin\"
        } elseif (Test-Path "C:\msys64\mingw64\bin\as.exe") {
          $asPath = "C:\msys64\mingw64\bin\"
        } else {
          Write-Error "as.exe not found in either MSYS2 usr/bin or mingw64/bin"
          exit 1
        }
        
        Write-Output "Using AsmPath: $asPath"
        
        msbuild otvdm.sln /t:Rebuild /p:Configuration=Release /p:Platform=Win32 `
          /p:AsmPath="$asPath" `
          /p:FlexPath="C:\ProgramData\chocolatey\lib\winflexbison\tools\" `
          /p:BisonPath="C:\ProgramData\chocolatey\lib\winflexbison\tools\"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: otvdm-v0.9.0-build
        path: |
          **/*.exe
          **/*.dll

