name: Build winevdm
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1

    - name: Install winflexbison (Chocolatey)
      shell: powershell
      run: |
        choco install winflexbison -y
        Import-Module $env:ChocolateyInstall\helpers\chocolateyProfile.psm1

    - name: Set up MSYS2 for assembler
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: mingw-w64-x86_64-binutils

    - name: Install binutils (assembler) in MSYS2
      run: |
        C:\msys64\usr\bin\bash.exe -lc "pacman -Syu --noconfirm"
        C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm binutils"
        
    - name: Add Chocolatey bin to PATH
      shell: powershell
      run: |
        $chocBin = 'C:\ProgramData\chocolatey\bin'
        if (Test-Path $chocBin) {
          Add-Content -Path $env:GITHUB_PATH -Value $chocBin
        }
        $wfbTools = 'C:\ProgramData\chocolatey\lib\winflexbison\tools'
        if (Test-Path $wfbTools) {
          Add-Content -Path $env:GITHUB_PATH -Value $wfbTools
        }

    # --- FIX 1: Make flex/bison discoverable by standard names ---
    - name: Fix Flex and Bison names
      shell: powershell
      run: |
        $tools = "C:\ProgramData\chocolatey\lib\winflexbison\tools"
        Write-Output "Creating aliases for flex and bison in $tools"
        if (Test-Path "$tools\win_flex.exe") { Copy-Item "$tools\win_flex.exe" "$tools\flex.exe" -Force }
        if (Test-Path "$tools\win_bison.exe") { Copy-Item "$tools\win_bison.exe" "$tools\bison.exe" -Force }
    
    # --- FIX 2: Set M4 Path & Create Dummy unistd.h ---
    - name: Fix Environment for Bison and Compiler
      shell: powershell
      run: |
        # 1. Tell Bison where M4 is (Fixes "exited with code 1")
        $m4Path = "C:\ProgramData\chocolatey\lib\winflexbison\tools\m4.exe"
        Write-Output "Setting M4 environment variable to $m4Path"
        echo "M4=$m4Path" >> $env:GITHUB_ENV
        
        # 2. Create dummy unistd.h (Fixes "Cannot open include file: unistd.h")
        $dummyDir = "C:\dummyinclude"
        New-Item -ItemType Directory -Force -Path $dummyDir | Out-Null
        New-Item -ItemType File -Force -Path "$dummyDir\unistd.h" | Out-Null
        Write-Output "Created dummy unistd.h at $dummyDir\unistd.h"
        
        # 3. Add dummy include to MSVC Include Path
        echo "INCLUDE=$dummyDir;$env:INCLUDE" >> $env:GITHUB_ENV
    # -----------------------------------------------------------

    - name: Build Solution
      shell: powershell
      run: |
        $asPath = ""
        if (Test-Path "C:\msys64\usr\bin\as.exe") {
          $asPath = "C:\msys64\usr\bin\"
        } elseif (Test-Path "C:\msys64\mingw64\bin\as.exe") {
          $asPath = "C:\msys64\mingw64\bin\"
        } else {
          Write-Error "as.exe not found"
          exit 1
        }
        
        Write-Output "Using AsmPath: $asPath"
        
        msbuild otvdm.sln /t:Rebuild /p:Configuration=Release /p:Platform=Win32 `
          /p:AsmPath="$asPath" `
          /p:FlexPath=C:\ProgramData\chocolatey\lib\winflexbison\tools\ `
          /p:BisonPath=C:\ProgramData\chocolatey\lib\winflexbison\tools\

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: otvdm-v0.9.0-build
        path: |
          **/*.exe
          **/*.dll
