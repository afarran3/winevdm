name: Build winevdm
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1


    - name: Set up MSYS2 and install dependencies
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: flex bison mingw-w64-x86_64-binutils

    - name: Add MSYS2 usr/bin and mingw64/bin to PATH
      shell: powershell
      run: |
        $msysUsrBin = 'C:\msys64\usr\bin'
        $msysMingw64 = 'C:\msys64\mingw64\bin'
        
        if (Test-Path $msysUsrBin) {
          Write-Output $msysUsrBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        }
        if (Test-Path $msysMingw64) {
          Write-Output $msysMingw64 | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        }

    - name: Verify tools on PATH
      shell: powershell
      run: |
        Write-Output "=== Verify tools ==="
        $missing = $false

        if (-not (where.exe flex 2>$null)) {
          Write-Error "flex not found"
          $missing = $true
        }
        if (-not (where.exe bison 2>$null)) {
          Write-Error "bison not found"
          $missing = $true
        }
        if (-not (where.exe as 2>$null)) {
          Write-Error "as (assembler) not found"
          $missing = $true
        }

        if ($missing) { exit 1 }

        Write-Output "PATH=$env:Path"
        where.exe flex | Out-String | Write-Output
        where.exe bison | Out-String | Write-Output
        where.exe as | Out-String | Write-Output

    - name: Build Solution
      shell: powershell
      run: |
        msbuild otvdm.sln /t:Rebuild /p:Configuration=Release /p:Platform=Win32 `
          /p:AsmPath="C:\msys64\mingw64\bin\" `
          /p:FlexPath="" /p:BisonPath=""

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: otvdm-v0.9.0-build
        path: |
          **/*.exe
          **/*.dll

